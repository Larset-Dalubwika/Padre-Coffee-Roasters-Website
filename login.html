<!DOCTYPE html>
<!-- Kataraman: Ingles -->
<html lang="en">

<!-- PAYO -->

<head>
    <!-- Panùgod sa Google Fonts tanganing mautilisar su mga fonts ninda -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Partikular na an Montserrat, su font a gīgámit ta sa kanganaan (default) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- Pigagámit an UTF-8 tanganing di' magkaprobléma kin ayo UTF-8 characters -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./assets/iconography/pcr-logo-icon.png">

    <!-- Su título -->
    <title>Login</title>

    <!-- Su stylesheet -->
    <link rel="stylesheet" href="./pcr.css">
</head>

<!-- LAWAS -->

<body>
    <a href="./index.html" class="back-btn" aria-label="Go back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
    </a>

    <!-- Pigpábətnga' ubos; nakapaləg didi su ubos -->
    <div class="center-container">

        <!-- Pamayo (Header) -->
        <h2>Log in</h2>

        <!-- Su bəbtangan ning form -->
        <div class="form-container">
            <!-- Título san form -->
            <p class="form-label">EMAIL</p>
            <!-- Watak (placeholder), su nakabətang sa kanganaan didi -->
            <input type="text" placeholder="Enter your email" class="form-input" type="email">
        </div>

        <div class="form-container">
            <p class="form-label">PASSWORD</p>
            <input type="password" placeholder="Enter your password" class="form-input" type="password">
        </div>

        <!-- kapag nalipngan san tagagámit su password nya, didi sya pipindot -->
        <a class="center forgot-pass maxwidth" href="./forgot-password.html">Forgot Password?</a>

        <!-- Mariknəm a pindutang maiwas, mas saday ta' ayo ".sign-in" a class -->
        <a class="a btn-dark maxwidth finaliser-btn nomargins" href="./verify-email-login.html">Log in</a>

        <!-- Nakabətngang téksto -->
        <p class="center">or</p>

        <!-- Mariknəm a pindutang maiwas -->
        <button class="btn maxwidth">
            <!-- Lógo san Google -->
            <img src="./assets/iconography/google.svg" alt="Google Icon" class="icon-s">

            Log in with Google
        </button>

        <!-- Pindutan parangəp sa sign-up page -->
        <a href="./signup.html" class="a btn-borderless center btn-signup maxwidth">Need an account? Sign Up</a>
    </div>
</body>

</html>
