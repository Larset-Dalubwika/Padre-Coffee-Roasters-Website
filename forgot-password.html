<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <link rel="stylesheet" href="./pcr.css">

    <script src="./placeholder-images.js"></script>
</head>

<body>
    <div class="center-container">
        <div class="nogap center-v flex-col">
            <h2 class="nomargin">Reset Password</h2>
            <p class="subtext">Please enter your email.</p>

            <br>
            <!-- <hr> -->
            <!-- <br> -->
        </div>

        <div class="form-container">
            <p class="form-label">EMAIL</p>
            <input type="text" placeholder="Enter your email" class="form-input" type="email" aria-required="true">
        </div>

        <form action="" class="maxwidth">
            <button class="finaliser-btn maxwidth">Reset Password</button>
        </form>
    </div>
</body>

</html>
