<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email</title>

    <link rel="stylesheet" href="./pcr.css">

    <script src="./js/placeholder-images.js"></script>
</head>

<body>
    <a href="./login.html" class="back-btn" aria-label="Go back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
    </a>

    <div class="center-container">
        <div class="nogap center-v flex-col">
            <h2 class="nomargin">Verify it's you</h2>
            <p class="subtext">We sent a 6-digit code to <strong>larsetdalubwika@gmail.com</strong>.</p>

            <br>
        </div>

        <div class="form-container">
            <p class="form-label">VERIFICATION CODE</p>

            <div class="otp-row" id="otp-row">
                <input type="text" inputmode="numeric" class="otp-box" aria-label="Digit 1"
                    autocomplete="one-time-code">
                <input type="text" inputmode="numeric" class="otp-box" aria-label="Digit 2">
                <input type="text" inputmode="numeric" class="otp-box" aria-label="Digit 3">
                <input type="text" inputmode="numeric" class="otp-box" aria-label="Digit 4">
                <input type="text" inputmode="numeric" class="otp-box" aria-label="Digit 5">
                <input type="text" inputmode="numeric" class="otp-box" aria-label="Digit 6">
            </div>
            <p class="err" id="otp-error" role="alert">aaa</p>

            <br>

            <div class="col-1-3-1 maxwidth gap otp-actions">
                <button class="maxwidth nomargin" id="paste-btn" type="button">Paste Code</button>
                <button class="finaliser-btn maxwidth nomargin" id="verify-btn" type="button">Verify</button>
                <button class="maxwidth nomargin" id="paste-btn" type="button">Resend Code</button>
            </div>

            
            <!-- <button class="btn-dark maxwidth" id="verify-btn" type="button">Verify</button> -->

            

        </div>
    </div>

    <script src="./js/otp.js"></script>
</body>

</html>
